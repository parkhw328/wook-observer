name: wook-observer
services:
  app:
    image: wook-observer:1.4.0
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${OBSERVER_BIND_ADDRESS:-127.0.0.1}:${OBSERVER_PORT:-18080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/observer
      DATABASE_USER: observer
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-env.sh first}
      OBSERVER_ADMIN_USER: ${OBSERVER_ADMIN_USER:-admin}
      OBSERVER_ADMIN_PASSWORD: ${OBSERVER_ADMIN_PASSWORD:?Set the initial admin password}
      OBSERVER_ENCRYPTION_KEY: ${OBSERVER_ENCRYPTION_KEY:?Set the credential encryption key}
      OBSERVER_UPDATE_DIRECTORY: /app/updates
      OBSERVER_MIRROR_HOSTS: ${OBSERVER_MIRROR_HOSTS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./updates:/app/updates:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/actuator/health]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: observer
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set the database password}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U observer -d observer"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
volumes:
  database:
