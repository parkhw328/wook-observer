spring:
  application:
    name: wook-observer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/observer}
    username: ${DATABASE_USER:observer}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 8
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 65MB
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
observer:
  platform:
    bootstrap-user: ${OBSERVER_ADMIN_USER:admin}
    bootstrap-password: ${OBSERVER_ADMIN_PASSWORD:}
    encryption-key: ${OBSERVER_ENCRYPTION_KEY:}
    update-directory: ${OBSERVER_UPDATE_DIRECTORY:./updates}
    mirror-hosts: ${OBSERVER_MIRROR_HOSTS:}
  docker-enabled: true
  docker-socket: /var/run/docker.sock
  jvm-attach-enabled: true
  command-timeout: 3s
  max-processes: 4096
  max-containers: 256
  max-java-processes: 64
  max-jars-per-process: 512
  service-overrides: {}
